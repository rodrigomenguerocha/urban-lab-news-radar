name: Collect and publish

on:
  schedule:
    # 11:40 UTC = 07:40 New York during EDT (06:40 during EST — GitHub cron has no
    # timezone, and Actions may start a scheduled run several minutes to hours late).
    - cron: '40 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max candidates sent to the API this run'
        required: false
        default: '60'
      dry_run:
        description: 'Read feeds only, no API call'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node collector/collect.mjs --dry-run --limit "${{ inputs.limit || 60 }}"
          else
            node collector/collect.mjs --limit "${{ inputs.limit || 60 }}"
          fi

      - name: Commit new articles
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  'urban-lab-radar[bot]'
          git config user.email 'actions@github.com'
          git add site/data/articles.json
          if git diff --staged --quiet; then
            echo 'No change to commit.'
          else
            git commit -m "data: collection for $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
